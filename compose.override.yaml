services:
  adminer:
    depends_on:
      - db
    build:
      context: .
      target: adminer
    container_name: adminer
    ports:
      - '8080:8080'
  api:
    build:
      target: builder-api
    image: busmap-api_dev
    container_name: api_dev
    user: node
    ports:
      - '3000:3000'
    volumes:
      - ./packages/api:/app/packages/api
      # Use dist built inside the image for shared packages
      - node_modules_root:/app/node_modules
      - node_modules_api:/app/packages/api/node_modules
      - dist_api:/app/packages/api/dist
    command:
      - npm
      - run
      - dev
      - -w
      - api
  ui:
    depends_on:
      - api
    build:
      context: .
      target: builder-ui
    container_name: ui
    user: node
    volumes:
      - ./packages/ui:/app/packages/ui
      # Use dist built inside the image for shared packages
      - ./packages/components/dist:/app/packages/components/dist:ro
      - ./packages/common/dist:/app/packages/common/dist:ro
      - ./.env:/app/.env # used to inject VITE_ env vars
      - node_modules_root:/app/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - dist_ui:/app/packages/ui/dist
    ports:
      - '5173:5173'
    environment:
      API_HOST: ${API_HOST}
    command:
      - npm
      - run
      - dev
      - -w
      - ui
  playwright:
    depends_on:
      - api
    build:
      context: .
      target: playwright
    container_name: playwright
    user: node
    volumes:
      - ./packages/ui:/app/packages/ui
      # Use dist built inside the image for shared packages
      - ./tests:/app/tests
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./.env:/app/.env # used to inject VITE_ env vars
      - node_modules_root:/app/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - dist_ui:/app/packages/ui/dist
    ports:
      - '5173:5173'
    environment:
      API_HOST: ${API_HOST}
    command:
      - npm
      - run
      - dev
      - -w
      - ui
  storybook:
    build:
      context: .
      target: builder-common
    container_name: storybook
    user: node
    volumes:
      - ./packages/components:/app/packages/components
      - node_modules_root:/app/node_modules
      - node_modules_components:/app/packages/components/node_modules
    ports:
      - '9000:9000'
    command:
      - npm
      - run
      - storybook
      - -w
      - '@busmap/components'
  dev:
    depends_on:
      - ui
    build:
      context: .
      target: dev
    container_name: dev
    ports:
      - '80:80'
      - '443:443'
    environment:
      UPSTREAM_API_HOST: ${UPSTREAM_API_HOST}

  stage:
    volumes:
      - ./packages/ui/dist:/var/www/${HOST_NAME}

volumes:
  node_modules_root:
  node_modules_api:
  node_modules_ui:
  node_modules_components:
  dist_ui:
  dist_api:
